<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập / Đăng ký - ShoeStore</title>
    <link rel="stylesheet" href="./css/dangnhap.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <a href="./index.html" class="nut-tro-ve">
        <i class="fas fa-arrow-left"></i>
    </a>

    <div class="khung-dang-nhap">
        <div class="tieu-de-form">
            <div class="logo-form">
                <i class="fas fa-shoe-prints"></i>
                <h1>ShoeStore</h1>
            </div>
            <p>Chào mừng bạn quay trở lại!</p>
        </div>

        <div class="cac-tab">
            <button class="nut-tab active" data-tab="dang-nhap">
                <i class="fas fa-sign-in-alt"></i>
                Đăng nhập
            </button>
            <button class="nut-tab" data-tab="dang-ky">
                <i class="fas fa-user-plus"></i>
                Đăng ký
            </button>
        </div>

        <!-- Form Đăng nhập -->
        <div class="noi-dung-tab active" id="dang-nhap">
            <form class="form-dang-nhap" id="formDangNhap">
                <div class="nhom-input">
                    <label for="tenDangNhap">Tên đăng nhập hoặc Email</label>
                    <div class="o-nhap-lieu">
                        <i class="fas fa-user icon-truoc"></i>
                        <input type="text" id="tenDangNhap" name="tenDangNhap" placeholder="Nhập tên đăng nhập hoặc email">
                    </div>
                    <div class="thong-bao-loi" id="loiTenDangNhap"></div>
                </div>

                <div class="nhom-input">
                    <label for="matKhauDangNhap">Mật khẩu</label>
                    <div class="o-nhap-lieu">
                        <i class="fas fa-lock icon-truoc"></i>
                        <input type="password" id="matKhauDangNhap" name="matKhauDangNhap" placeholder="Nhập mật khẩu">
                        <i class="fas fa-eye icon-sau hien-mat-khau" data-target="matKhauDangNhap"></i>
                    </div>
                    <div class="thong-bao-loi" id="loiMatKhauDangNhap"></div>
                </div>

                <div class="tuy-chon-form">
                    <label class="checkbox-nho">
                        <input type="checkbox" id="nhoMatKhau">
                        <span class="checkmark"></span>
                        Ghi nhớ mật khẩu
                    </label>
                </div>

                <button type="submit" class="nut-gui">
                    <span class="chu-nut">Đăng nhập</span>
                    <div class="loading" id="loadingDangNhap"></div>
                </button>
            </form>
        </div>

        <!-- Form Đăng ký - Đã đơn giản hóa -->
        <div class="noi-dung-tab" id="dang-ky">
            <form class="form-dang-ky" id="formDangKy">
                <div class="nhom-input">
                    <label for="hoTen">Họ và tên</label>
                    <div class="o-nhap-lieu">
                        <i class="fas fa-user-tag icon-truoc"></i>
                        <input type="text" id="hoTen" name="hoTen" placeholder="Nhập họ và tên đầy đủ">
                    </div>
                    <div class="thong-bao-loi" id="loiHoTen"></div>
                </div>

                <div class="nhom-input">
                    <label for="tenDangKy">Tên đăng nhập</label>
                    <div class="o-nhap-lieu">
                        <i class="fas fa-user icon-truoc"></i>
                        <input type="text" id="tenDangKy" name="tenDangKy" placeholder="Ít nhất 3 ký tự">
                    </div>
                    <div class="thong-bao-loi" id="loiTenDangKy"></div>
                </div>

                <div class="nhom-input">
                    <label for="emailDangKy">Email</label>
                    <div class="o-nhap-lieu">
                        <i class="fas fa-envelope icon-truoc"></i>
                        <input type="email" id="emailDangKy" name="emailDangKy" placeholder="example@email.com">
                    </div>
                    <div class="thong-bao-loi" id="loiEmailDangKy"></div>
                </div>

                <div class="nhom-input">
                    <label for="matKhauDangKy">Mật khẩu</label>
                    <div class="o-nhap-lieu">
                        <i class="fas fa-lock icon-truoc"></i>
                        <input type="password" id="matKhauDangKy" name="matKhauDangKy" placeholder="Ít nhất 6 ký tự">
                        <i class="fas fa-eye icon-sau hien-mat-khau" data-target="matKhauDangKy"></i>
                    </div>
                    <div class="thong-bao-loi" id="loiMatKhauDangKy"></div>
                </div>

                <div class="nhom-input">
                    <label for="xacNhanMatKhau">Xác nhận mật khẩu</label>
                    <div class="o-nhap-lieu">
                        <i class="fas fa-lock icon-truoc"></i>
                        <input type="password" id="xacNhanMatKhau" name="xacNhanMatKhau" placeholder="Nhập lại mật khẩu">
                        <i class="fas fa-eye icon-sau hien-mat-khau" data-target="xacNhanMatKhau"></i>
                    </div>
                    <div class="thong-bao-loi" id="loiXacNhanMatKhau"></div>
                </div>

                <button type="submit" class="nut-gui">
                    <span class="chu-nut">Đăng ký</span>
                    <div class="loading" id="loadingDangKy"></div>
                </button>
            </form>
        </div>
    </div>

    <script src="./js/dangnhap.js"></script>
</body>
</html>
