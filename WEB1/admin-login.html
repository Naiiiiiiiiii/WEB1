<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Trang đăng nhập</title>
</head>

<body>
    <form class="form_login" id="formDangNhap">
        <h1>Đăng nhập</h1>
        <label for="username">Username </label>
        <input type="text" id="username" name="username" placeholder="default username = admin" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="default password = Admin123" required>

        <button type="submit" name="Login">Login</button>
    </form>
</body>

<style>
* {
    font-family: "Segoe UI", sans-serif;
}

body {
    background-color: #616161;
}

.form_login {
    width: 520px;
    margin: 50px auto;
    padding: 20px;
    border: 1px solid #ccc;
    border-radius: 10px;
    background-color:rgb(28, 202, 255);
}

.form_login h1 {
    font-style: o;
    text-align: center;
    margin-bottom: 13px;
    color: #333;
}

.form_login label {
    margin-bottom: 8px;
    font-weight: bold;
    color: #333;
}

.form_login input[type="text"],
.form_login input[type="password"] {
    width: 95%;
    padding: 8px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 13px;
}

.form_login button {
    width: 69%;
    padding: 10px;
    background-color:rgb(181, 45, 231);
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
    text-shadow: 2px 2px 4px #000;
    display: block;
    margin: 0 auto
}

.form_login button:hover {
    background-color:rgb(239, 20, 100);
}

.form_login p {
    text-align: center;
    margin-top: 10px;
}
</style>

<script type="module" src="/WEB1/js/admin-login.js"></script>
